version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: vibe-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vibe
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=galphoe3000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose only to localhost (127.0.0.1) on the VM host for safety
      - "127.0.0.1:5432:5432"

  web:
    build: .
    container_name: vibe-server
    restart: unless-stopped
    ports:
      # Expose FastAPI on port 8000 to the public internet (make sure port 8000 is open in OCI Security List)
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides DATABASE_URL in .env to point to the 'db' container in the same docker network
      - DATABASE_URL=postgresql://postgres:galphoe3000@db:5432/vibe
    depends_on:
      - db

volumes:
  postgres_data:
